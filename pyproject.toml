[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astrodb"
version = "0.1.1"
description = "TUI for querying, cleaning, and persisting astronomical database records."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lldddv2" }]
requires-python = ">=3.10"
dependencies = [
    "textual[syntax]>=0.52.0",
    "pyvo>=1.5.1",  # Virtual Observatory standards (ADQL)
    "pandas>=2.2.0",
    "Pillow>=10.0.0",
    "rich-pixels>=3.0.0",
    "sqlglot",
]

[project.urls]
Homepage = "https://github.com/lldddv2/astrodb"
Repository = "https://github.com/lldddv2/astrodb"
Issues = "https://github.com/lldddv2/astrodb/issues"

[project.scripts]
astrodb = "astrodb.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/astrodb"]
